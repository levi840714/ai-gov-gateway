svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}
.head{fill:var(--muted);font-size:12px;font-weight:700}
