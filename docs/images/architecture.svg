<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1040" width="980" role="img" aria-labelledby="title desc"><title id="title">ai-gov-gateway 的整體架構與能力</title><desc id="desc">呼叫端只連 gateway；gateway 內先做兩條路徑共用的檢查（Authorization、路由、agent 版本、委託人），再分成 LLM Gateway（路由與用量、使用者額度、內容防護）與 MCP Gateway（存取控制、授權與審批），最後是治理 API 與 hash chain 稽核；後端為 LLM provider、下游 MCP server、Keycloak、OPA 與 Postgres。顏色標示能力加入的開發階段。</desc><style>
:root{--bg:#ffffff;--fg:#1c1d1f;--fg2:#3d4145;--muted:#676c72;--rule:#e2e0d8;--strong:#c4c1b8;--surface:#ffffff;--surface2:#f6f5f1;--accent:#3b4fa0;--accentsoft:#eceffa;
