<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 994" width="980" role="img" aria-labelledby="title desc"><title id="title">ai-gov-gateway 的整體架構與能力</title><desc id="desc">呼叫端只連 gateway。gateway 先做入口防護，再分成 LLM Gateway（Routing 與用量、Guardrails）與 MCP Gateway（Access Control）兩條路徑；兩條路徑都經過同一個治理核心：Identity、Policy 與額度、Approval、Audit。後端為 LLM provider、下游 MCP server、Keycloak、OPA 與 Postgres。顏色標示能力加入的開發階段。</desc><style>
:root{--bg:#ffffff;--fg:#1c1d1f;--fg2:#3d4145;--muted:#676c72;--rule:#e2e0d8;--strong:#c4c1b8;--surface:#ffffff;--surface2:#f6f5f1;--accent:#3b4fa0;--accentsoft:#eceffa;
--m1:#2f7fc1;--m1bg:#e3f0fa;--m1fg:#1d5a8c;--m2:#1f9086;--m2bg:#dff3f0;--m2fg:#136b63;--m3:#7a5cc8;--m3bg:#eee8fa;--m3fg:#5a3fa3;--m4:#c07a12;--m4bg:#fbefd9;--m4fg:#8a5508;--m5:#c2416b;--m5bg:#fbe4ec;--m5fg:#8f2a4c}
