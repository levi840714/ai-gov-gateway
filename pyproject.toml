[project]
name = "ai-governance-gateway"
version = "0.1.0"
description = "Governance gateway for agent LLM traffic and tool calls"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=1.30,<2",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8.4", "ruff>=0.13"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: requires docker compose services"]
addopts = "-m 'not integration'"
