name: ai-gov-gateway

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"

  probe_mcp:
    build:
      context: .
      dockerfile: probe_mcp/Dockerfile
    environment:
      PROBE_WHOAMI_DESCRIPTION: ${PROBE_WHOAMI_DESCRIPTION:-Return the headers and bearer token claims this server received.}
    ports:
      - "127.0.0.1:8100:8100"

  probe_llm:
    build:
      context: .
      dockerfile: probe_llm/Dockerfile
    # 只綁 127.0.0.1：demo 與整合測試要讀取它記錄的請求
    ports:
      - "127.0.0.1:8300:8300"

  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      retries: 10

  account_ops:
    build:
      context: .
      dockerfile: account_ops/Dockerfile
    # 本身不驗證呼叫者，只放在 gateway 才能進入的內部網路
    networks: [governed]

  opa:
    image: docker.io/openpolicyagent/opa:1.21.1
    # 不對外開 port：只有 gateway 能透過內部網路查詢
    networks: [governed]
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--watch", "--log-level", "error", "/policies"]
    volumes:
      - ./policies:/policies:ro

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      AI_GATEWAY_CLIENT_SECRET: ${AI_GATEWAY_CLIENT_SECRET}
      STORE_MODEL_IN_DB: "True"
      GOV_DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/governance
      GOV_OPA_URL: http://opa:8181
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    networks: [default, governed]
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      keycloak:
        condition: service_started

networks:
  governed:
    internal: true

volumes:
  pgdata:
